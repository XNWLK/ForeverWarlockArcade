<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forever Warlock Arcade</title>
<meta name="description" content="Little Warlock games for WoW: Forever fans - in the browser and as an addon in the game.">
<link rel="icon" href="art/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Philosopher:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #050309; --bar: rgba(16, 11, 24, 0.85); --line: rgba(140, 100, 210, 0.22); --text: #b9adc9; --link: #f0cd6e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.3 'Roboto Condensed', 'Arial Narrow', sans-serif; }
  body { display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 25% 10%, #22123a 0%, transparent 55%), radial-gradient(ellipse at 85% 95%, #0d2412 0%, transparent 50%), var(--bg); }
  #stage { position: relative; flex: 1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wow-ui { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .wow-ui > div { position: absolute; box-sizing: border-box; pointer-events: none; }
  .wow-ui > .wow-frame { pointer-events: auto; }
  .wow-font { display: flex; overflow: visible; }
  .wow-font > span { display: block; width: 100%; }
  .wow-tip { position: absolute; display: none; max-width: 300px; padding: 7px 9px; box-sizing: border-box; pointer-events: none;
    background: rgba(14, 10, 24, 0.9); border: 1px solid rgba(170, 130, 255, 0.35); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font: 12px/1.35 'Philosopher', serif; color: #ffd200; }
  .wow-tip-row { display: flex; gap: 14px; justify-content: space-between; }
  .wow-tip-row.head { font-size: 14px; margin-bottom: 2px; }
  .wow-tip-row .right { white-space: nowrap; }
  .wow-error { position: fixed; left: 0; right: 0; bottom: 30px; display: none; padding: 6px 12px; background: #4a0d0d; color: #ffd5d5;
    font: 12px monospace; z-index: 99999; white-space: pre-wrap; }
  footer { flex: none; height: 28px; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 16px;
    background: var(--bar); border-top: 1px solid var(--line); white-space: nowrap; overflow-x: auto; letter-spacing: 0.02em; }
  footer a { color: var(--link); text-decoration: none; }
  footer a { transition: color 0.15s, text-shadow 0.15s; }
  footer a:hover { color: #ffe39a; text-shadow: 0 0 12px rgba(255, 210, 110, 0.5); }
  footer .sep { color: #4a3d5a; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center;
    font: 20px 'Cinzel', serif; color: #a593c2; letter-spacing: 0.06em; animation: pulse 1.8s ease-in-out infinite; }
  #loading::before { content: ''; width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(160, 120, 255, 0.18);
    border-top-color: #9d7bff; border-right-color: #6ee36a; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: 0.6; } }
  body.ready #loading { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="loading">Summoning the arcade...</div></div>
<footer>
  <span>Forever Warlock Arcade</span><span class="sep">|</span>
  <a href="https://github.com/XNWLK/ForeverWarlockArcade" target="_blank" rel="noopener">GitHub</a>
  <a href="https://www.curseforge.com/wow/addons/warlock-arcade" target="_blank" rel="noopener">In-game addon</a><span class="sep">|</span>
  <a href="https://xnwlk.github.io/WarlockSIM/" target="_blank" rel="noopener">Warlock SIM</a>
  <a href="https://xnwlk.github.io/ForeverWarlocking/" target="_blank" rel="noopener">Forever Warlocking</a>
  <a href="https://www.curseforge.com/wow/addons/xns-warlock-sim" target="_blank" rel="noopener">Sim addon</a>
</footer>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center">The arcade needs JavaScript.</p></noscript>
<script>
// Loads the page's scripts with this build's fingerprint (web/build.txt, always read fresh), so a browser that has
// an older version cached never mixes old and new files.
(function () {
  var list = ['web/fengari.js', 'web/wow-core.js', 'web/wow-dom.js', 'web/sound.js', 'web/icons.js'];
  function go(v) {
    (function next(i) {
      if (i >= list.length) { WowDom.start({ addon: 'WarlockArcade', version: v }); return; }
      var s = document.createElement('script');
      s.src = list[i] + '?v=' + v;
      s.onload = function () { next(i + 1); };
      s.onerror = function () { document.getElementById('loading').textContent = 'Could not load the arcade - please reload the page.'; };
      document.body.appendChild(s);
    })(0);
  }
  fetch('web/build.txt', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : String(Date.now()); })
    .then(function (t) { go(t.trim()); }, function () { go(String(Date.now())); });
})();
</script>
</body>
</html>
